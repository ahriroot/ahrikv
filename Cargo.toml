[package]
name = "ahrikv"
version = "0.0.5"
edition = "2021"
rust-version = "1.85"
authors = ["ahriknow <ahriknow@ahriknow.com>"]
description = "A high-performance in-memory key-value store."
license = "MIT"
repository = "https://github.com/ahriroot/ahrikv"
documentation = "https://github.com/ahriroot/ahrikv"
readme = "README.md"
keywords = [
    "ahrikv",
    "kv",
    "key-value",
    "database",
]
categories = ["asynchronous", "database-implementations"]

[[bin]]
name = "akvs"
path = "src/server/main.rs"

[[bin]]
name = "akvc"
path = "src/cli/main.rs"

[lib]
name = "akv"
path = "src/lib/mod.rs"

[dependencies]
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0"
